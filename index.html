<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Quarnum</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0d18; }
    #unity-container {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #0b0d18;
    }
    #unity-canvas {
      display: block;
      height: 100%;
      width: auto;
      max-width: 100%;
      aspect-ratio: 9 / 16;
      background: #0b0d18;
      outline: none;
    }
    /* On phones the viewport is close to 9:16 already; fill it rather than
       leaving letterbox bars when browser chrome changes the height. */
    @media (max-width: 700px) {
      #unity-canvas { width: 100%; height: 100%; aspect-ratio: auto; }
    }
    #unity-loading-bar {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(380px, 74vw); text-align: center;
    }
    #unity-brand {
      display: block; width: 100%; height: auto; margin: 0 auto;
      opacity: 0; animation: unity-brand-in 380ms ease-out 40ms forwards;
    }
    @keyframes unity-brand-in { to { opacity: 1; } }
    #unity-progress-bar-empty {
      width: min(180px, 52vw); height: 8px; margin: 16px auto 0;
      background: #232a48; border-radius: 4px; overflow: hidden;
    }
    #unity-progress-bar-full {
      width: 0%; height: 100%; background: #5b7cff; border-radius: 4px;
      transition: width 120ms linear;
    }
    #unity-warning {
      position: absolute; left: 0; right: 0; top: 0; z-index: 10;
      color: #10131f; font: 14px/1.4 sans-serif;
    }
    #unity-warning > div { padding: 8px 12px; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <img id="unity-brand" src="logo-ru.png" alt="">
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
    </div>
    <div id="unity-warning"></div>
  </div>
  <script>
    // The loading screen speaks the browser's language: RU «Кварнум» /
    // EN «Quarnum» (docs/gdd.md §1). In-game text is localized by the game.
    (function () {
      var lang = (navigator.language || "ru").toLowerCase();
      if (lang.indexOf("ru") === 0) return;
      document.documentElement.lang = "en";
      document.title = "QUARNUM";
      var brand = document.getElementById("unity-brand");
      if (brand) brand.src = "logo-en.png";
    })();
  </script>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <script>
    // VK Mini Apps requires VKWebAppInit before the game starts. Keep the
    // wrapper best-effort so the same build also works in a plain browser.
    (function () {
      if (!window.vkBridge || typeof window.vkBridge.send !== "function") return;
      try {
        var init = window.vkBridge.send("VKWebAppInit");
        if (init && typeof init.catch === "function") init.catch(function () {});
      } catch (error) {
        // Outside VK the bridge may not be available; the game still loads.
      }
    })();
  </script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var container = document.querySelector("#unity-container");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      var div = document.createElement("div");
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type === "error") div.style.background = "red";
      else if (type === "warning") div.style.background = "yellow";
      else div.style.background = "#9aa6d1";
      setTimeout(function () { div.remove(); }, type === "error" ? 30000 : 5000);
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WebGL.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Quarnum",
      productName: "Quarnum",
      productVersion: "0.2.4",
      showBanner: unityShowBanner
    };

    loadingBar.style.display = "block";
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressFull.style.width = (100 * progress) + "%";
      }).then(function () {
        loadingBar.style.display = "none";
      }).catch(function (message) {
        unityShowBanner(message, "error");
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
